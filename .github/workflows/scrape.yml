name: LinkedIn Post Scraper

on:
  # Runs every day at 7:00 AM UTC
  schedule:
    - cron: '0 7 * * *'
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-linkedin:
    # ─── FIX: Pin to Ubuntu 22.04 ────────────────────────────────────────────
    # ubuntu-latest is now 24.04 (Noble) which renamed libasound2 → libasound2t64
    # Playwright's install-deps still expects the old name, so we use 22.04 (Jammy)
    # which has full Playwright support and the correct package names.
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python dependencies
        run: pip install -r requirements.txt

      - name: 🌐 Install Playwright browser + dependencies
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: 🔍 Run LinkedIn scraper
        env:
          LINKEDIN_EMAIL:       ${{ secrets.LINKEDIN_EMAIL }}
          LINKEDIN_PASSWORD:    ${{ secrets.LINKEDIN_PASSWORD }}
          LINKEDIN_PROFILE_URL: ${{ secrets.LINKEDIN_PROFILE_URL }}
        run: python scraper.py

      - name: 💾 Commit updated posts.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "chore: update LinkedIn posts [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
