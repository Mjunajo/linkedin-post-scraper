name: LinkedIn Post Scraper

on:
  schedule:
    - cron: '0 7 * * *'   # Daily at 7:00 AM UTC
  workflow_dispatch:        # Manual trigger from Actions tab

permissions:
  contents: write           # To commit posts.json

jobs:
  scrape-linkedin:
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python dependencies
        run: pip install -r requirements.txt

      - name: 🔍 Run LinkedIn scraper
        env:
          LINKEDIN_LI_AT:       ${{ secrets.LINKEDIN_LI_AT }}
          LINKEDIN_PROFILE_URL: ${{ secrets.LINKEDIN_PROFILE_URL }}
          GH_PAT:               ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY:    ${{ github.repository }}
        run: python scraper.py

      - name: 💾 Commit updated posts.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "chore: update LinkedIn posts [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
